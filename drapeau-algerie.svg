<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="240"/>
    </clipPath>
    <clipPath id="leftHalfClip">
      <rect x="0" y="0" width="250" height="500"/>
    </clipPath>
    <clipPath id="rightHalfClip">
      <rect x="250" y="0" width="250" height="500"/>
    </clipPath>
  </defs>

  <!-- Circular Algerian Flag Badge -->
  <g clip-path="url(#circleClip)">
    <!-- Left Half: Green -->
    <rect x="0" y="0" width="250" height="500" fill="#006233"/>
    <!-- Right Half: White -->
    <rect x="250" y="0" width="250" height="500" fill="#FFFFFF"/>

    <!-- Crescent Outer (Red) -->
    <circle cx="250" cy="250" r="120" fill="#D21034"/>

    <!-- Crescent Inner Cutout (Left part green, right part white) -->
    <g>
      <!-- Green Cutout on Left Half -->
      <circle cx="274" cy="250" r="96" fill="#006233" clip-path="url(#leftHalfClip)"/>
      <!-- White Cutout on Right Half -->
      <circle cx="274" cy="250" r="96" fill="#FFFFFF" clip-path="url(#rightHalfClip)"/>
    </g>

    <!-- Red 5-Point Star with one point pointing right (0 deg) -->
    <!-- Star center: x=290, y=250, outer radius=38, inner radius=14.5 -->
    <polygon points="
      328,250
      301.7,258.5
      301.7,286.1
      285.5,263.8
      259.3,272.3
      275.5,250
      259.3,227.7
      285.5,236.2
      301.7,213.9
      301.7,241.5
    " fill="#D21034"/>
  </g>

  <!-- Elegant Outer Border -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#004524" stroke-width="6"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
</svg>